<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F5F2EC" />
<title>Klinekraft · Proof Preview</title>

<!-- Fonts: Inter Tight for UI, Fraunces for the brand wordmark accent -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">

<!-- PDF.js (Mozilla) — renders PDF pages to canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip — realistic page-turn animation -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
  :root {
    /* Klinekraft palette */
    --bg: #F5F2EC;           /* off-white, warm */
    --bg-elev: #EFEBE2;       /* slightly deeper for surfaces */
    --bg-deep: #E7E2D5;       /* deeper for the book stage */
    --ink: #1A1A1A;           /* near-black text */
    --ink-soft: #5A584F;      /* secondary text */
    --ink-faint: #9A988E;     /* tertiary, dividers */
    --accent: #155742;        /* Klinekraft forest green */
    --accent-soft: #1F7A5E;
    --accent-bg: rgba(21, 87, 66, 0.06);
    --rule: rgba(26, 26, 26, 0.10);
    --rule-strong: rgba(26, 26, 26, 0.20);

    --font-sans: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-serif: "Fraunces", "Times New Roman", serif;

    --shadow-book: 0 30px 60px -20px rgba(20, 20, 20, 0.25),
                   0 18px 36px -18px rgba(20, 20, 20, 0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* ─────────── TOP BAR ─────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
    z-index: 20;
    position: relative;
    flex: 0 0 auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    height: 28px;
    width: auto;
  }

  .brand-mark svg { height: 100%; width: auto; display: block; }

  .brand-divider {
    width: 1px;
    height: 22px;
    background: var(--rule-strong);
  }

  .brand-context {
    font-family: var(--font-serif);
    font-weight: 300;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    border-radius: 6px;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease;
    padding: 0;
  }

  .icon-btn:hover { background: var(--accent-bg); color: var(--accent); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn svg { width: 18px; height: 18px; stroke-width: 1.6; }

  .icon-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
  .icon-btn[disabled]:hover { background: transparent; color: var(--ink-soft); }

  /* ─────────── STAGE ─────────── */
  .stage {
    flex: 1 1 auto;
    position: relative;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0.04) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-elev) 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .book-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* When showing cover alone, shift the book so the cover appears centered
     rather than offset to the right side of the spread frame. This applies
     only on desktop where spread mode is active. */
  .book-wrap.is-cover-alone #flipbook {
    transform: translateX(-25%);
    transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .book-wrap.is-back-cover-alone #flipbook {
    transform: translateX(25%);
    transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .book-wrap #flipbook {
    transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Portrait (single page) mode handles itself — no shift needed */
  @media (max-width: 899px) {
    .book-wrap.is-cover-alone #flipbook,
    .book-wrap.is-back-cover-alone #flipbook {
      transform: none;
    }
  }

  #flipbook {
    background: transparent;
  }

  /* StPageFlip page styling. The library applies its own dynamic shadows;
     we keep individual pages clean and let the inner content fill. */
  .page {
    background: white;
    overflow: hidden;
  }
  .page img,
  .page canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  /* ─────────── SIDE NAV (desktop) ─────────── */
  .side-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--rule);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    transition: all 180ms ease;
    z-index: 5;
  }
  .side-nav:hover { background: white; color: var(--accent); border-color: var(--accent); }
  .side-nav:active { transform: translateY(-50%) scale(0.94); }
  .side-nav[disabled] { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
  .side-nav.prev { left: 24px; }
  .side-nav.next { right: 24px; }
  .side-nav svg { width: 18px; height: 18px; stroke-width: 1.8; }

  /* ─────────── BOTTOM BAR ─────────── */
  .bottombar {
    background: var(--bg);
    border-top: 1px solid var(--rule);
    padding: 16px 28px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .thumbnail-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule-strong) transparent;
  }

  .thumbnail-strip::-webkit-scrollbar { height: 4px; }
  .thumbnail-strip::-webkit-scrollbar-track { background: transparent; }
  .thumbnail-strip::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 2px; }

  .thumb {
    flex: 0 0 auto;
    width: 44px;
    height: 57px;
    background: var(--bg-elev);
    border: 1.5px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    transition: border-color 160ms ease, transform 160ms ease;
  }
  .thumb canvas, .thumb img { width: 100%; height: 100%; display: block; }
  .thumb:hover { border-color: var(--ink-faint); }
  .thumb.active { border-color: var(--accent); transform: scale(1.04); }
  .thumb-num {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    font-size: 9px;
    font-weight: 500;
    text-align: center;
    color: white;
    background: rgba(0,0,0,0.55);
    padding: 1px 0;
    line-height: 1;
  }

  .bottombar-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .page-indicator {
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    color: var(--ink);
  }
  .page-indicator .sep { color: var(--ink-faint); margin: 0 6px; font-weight: 400; }
  .page-indicator .total { color: var(--ink-soft); font-weight: 400; }

  .doc-title {
    font-family: var(--font-serif);
    font-weight: 300;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 40vw;
  }

  /* ─────────── LANDING / UPLOAD ─────────── */
  .landing {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    transition: opacity 400ms ease;
  }
  .landing.hidden { opacity: 0; pointer-events: none; }

  .landing-inner {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  .landing-logo {
    height: 36px;
    margin-bottom: 48px;
  }
  .landing-logo svg { height: 100%; width: auto; }

  .landing-eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 16px;
    font-weight: 500;
  }

  .landing-title {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(32px, 5vw, 44px);
    line-height: 1.1;
    color: var(--ink);
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }
  .landing-title em {
    font-style: italic;
    color: var(--accent);
  }

  .landing-sub {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 40px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
  }

  .dropzone {
    display: block;
    width: 100%;
    border: 1px dashed var(--rule-strong);
    border-radius: 4px;
    padding: 48px 24px;
    background: var(--bg-elev);
    cursor: pointer;
    transition: all 200ms ease;
    position: relative;
    text-align: center;
    overflow: hidden;
  }

  .dropzone.busy {
    pointer-events: none;
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .dropzone.busy::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg,
      transparent 0%, var(--accent) 50%, transparent 100%);
    animation: dz-progress 1.4s linear infinite;
  }
  @keyframes dz-progress {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-bg);
  }

  .dropzone-label {
    font-size: 14px;
    color: var(--ink-soft);
  }
  .dropzone-label strong {
    color: var(--accent);
    font-weight: 500;
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
  }

  #file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
    opacity: 0;
    pointer-events: none;
  }

  .landing-footer {
    margin-top: 48px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ─────────── LOADING ─────────── */
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-deep);
    z-index: 10;
    gap: 16px;
  }
  .loading.hidden { display: none; }

  .loading-bar {
    width: 200px;
    height: 2px;
    background: var(--rule);
    overflow: hidden;
    border-radius: 1px;
  }
  .loading-bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 200ms ease;
  }
  .loading-text {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  /* ─────────── TOAST ─────────── */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: all 240ms ease;
    z-index: 1000;
    letter-spacing: 0.02em;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─────────── ZOOM OVERLAY ─────────── */
  .zoom-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.92);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 24px;
  }
  .zoom-overlay.show { display: flex; }

  .zoom-overlay img {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  }
  .zoom-close {
    position: absolute;
    top: 24px;
    right: 24px;
    color: white;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-close:hover { background: rgba(255,255,255,0.2); }

  /* ─────────── MOBILE ─────────── */
  @media (max-width: 768px) {
    .topbar { padding: 14px 16px; }
    .stage { padding: 16px 12px; }
    .bottombar { padding: 12px 16px; }
    .brand-context { display: none; }
    .side-nav { width: 38px; height: 38px; }
    .side-nav.prev { left: 8px; }
    .side-nav.next { right: 8px; }
    .doc-title { display: none; }
    /* Hide some icons on small screens to save space */
    .icon-btn[data-mobile-hide="true"] { display: none; }
  }

  @media (max-width: 480px) {
    .thumb { width: 36px; height: 47px; }
  }

  /* ─────────── FULLSCREEN ─────────── */
  :fullscreen .topbar,
  :fullscreen .bottombar { background: var(--bg); }
  :fullscreen .stage { background: var(--bg-deep); }
</style>
</head>
<body>

<!-- ─────────── LANDING SCREEN ─────────── -->
<div class="landing" id="landing">
  <div class="landing-inner">
    <div class="landing-logo" id="landing-logo"></div>
    <div class="landing-eyebrow">Proof Preview</div>
    <h1 class="landing-title">Review your booklet, <em>page by page.</em></h1>
    <p class="landing-sub">Drop a PDF below to preview as a flipbook. We'll host it in the background so you can copy a share link for the agent.</p>

    <label for="file-input" class="dropzone" id="dropzone">
      <div class="dropzone-label">
        Drop a PDF here, or <strong>browse</strong>
      </div>
    </label>
    <input type="file" id="file-input" accept="application/pdf,.pdf" />

    <div class="landing-footer">Klinekraft · Real Estate Print Studio</div>
  </div>
</div>

<!-- ─────────── TOP BAR ─────────── -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brand-mark"></div>
    <div class="brand-divider"></div>
    <div class="brand-context" id="brand-context">Proof Preview</div>
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" id="btn-share" title="Copy share link" data-mobile-hide="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-download" title="Download PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-zoom" title="Zoom current page" data-mobile-hide="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-close" title="Load a different PDF" data-mobile-hide="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</header>

<!-- ─────────── STAGE ─────────── -->
<main class="stage" id="stage">
  <div class="loading" id="loading">
    <div class="loading-text" id="loading-text">RENDERING · 0%</div>
    <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar"></div></div>
  </div>

  <div class="book-wrap">
    <button class="side-nav prev" id="nav-prev" title="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div id="flipbook"></div>

    <button class="side-nav next" id="nav-next" title="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>
</main>

<!-- ─────────── BOTTOM BAR ─────────── -->
<footer class="bottombar">
  <div class="thumbnail-strip" id="thumbs"></div>
  <div class="bottombar-meta">
    <div class="doc-title" id="doc-title"></div>
    <div class="page-indicator">
      <span class="current" id="page-current">—</span>
      <span class="sep">/</span>
      <span class="total" id="page-total">—</span>
    </div>
  </div>
</footer>

<!-- ─────────── ZOOM OVERLAY ─────────── -->
<div class="zoom-overlay" id="zoom-overlay">
  <button class="zoom-close" id="zoom-close" title="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <img id="zoom-img" alt="" />
</div>

<!-- ─────────── TOAST ─────────── -->
<div class="toast" id="toast">Link copied to clipboard</div>

<script>
// ════════════════════════════════════════════════════════════════════
// KLINEKRAFT PROOF PREVIEW — Flipbook Viewer
// PDF.js + StPageFlip, vanilla JS
// ════════════════════════════════════════════════════════════════════

// Configure PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ─── Helpers ───────────────────────────────────────────────────────
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function setLoading(pct, label) {
  loadingBar.style.width = pct + '%';
  loadingText.textContent = (label || 'RENDERING') + ' · ' + Math.round(pct) + '%';
}

function hideLoading() {
  loadingEl.classList.add('hidden');
}

function showLoading() {
  loadingEl.classList.remove('hidden');
  setLoading(0);
}

// ─── PDF rendering ─────────────────────────────────────────────────
async function renderPdfToImages(pdf) {
  const totalPages = pdf.numPages;
  pageImages = [];

  // Determine render scale based on device pixel ratio (cap for memory)
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Render at roughly 1.5x base resolution for sharp display + zoom headroom
  const renderScale = 1.5 * dpr;

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: renderScale });

    // Capture intrinsic page dimensions from page 1 (in pt @ scale=1)
    if (i === 1) {
      const baseVp = page.getViewport({ scale: 1 });
      pageWidth = baseVp.width;
      pageHeight = baseVp.height;
    }

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

    // Convert to JPEG data URL (smaller than PNG, fine for printed docs)
    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
    pageImages.push(dataUrl);

    setLoading((i / totalPages) * 90, 'RENDERING');
  }
}

// ─── Build the flipbook ────────────────────────────────────────────
function computeBookDimensions() {
  // Available stage area
  const stageRect = stage.getBoundingClientRect();
  const availW = stageRect.width - 64; // padding
  const availH = stageRect.height - 64;

  const aspect = pageWidth / pageHeight; // page aspect ratio (typically 8.5/11 = 0.773)

  // Spread mode only when the viewport is wide enough to comfortably fit two pages
  // side by side. StPageFlip will automatically fall back to single-page (portrait)
  // when its own threshold is hit too, but we set width as a single page in narrow
  // contexts so it sizes correctly.
  const isNarrow = window.innerWidth < 900;

  let pageW, pageH;
  if (isNarrow) {
    // Single page sizing — use most of available height
    pageH = availH;
    pageW = pageH * aspect;
    if (pageW > availW * 0.95) {
      pageW = availW * 0.95;
      pageH = pageW / aspect;
    }
  } else {
    // Spread sizing: total book width = 2 * pageW
    pageH = availH;
    pageW = pageH * aspect;
    if (pageW * 2 > availW) {
      pageW = availW / 2;
      pageH = pageW / aspect;
    }
  }

  return {
    width: Math.floor(pageW),
    height: Math.floor(pageH)
  };
}

function buildFlipbook() {
  // Clear any previous instance
  if (pageFlip) {
    try { pageFlip.destroy(); } catch (e) {}
    pageFlip = null;
  }
  flipbookEl.innerHTML = '';

  const { width, height } = computeBookDimensions();

  // Inject page elements
  pageImages.forEach((src, idx) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page';
    // Mark first and last pages as 'hard' for cover behavior
    if (idx === 0 || idx === pageImages.length - 1) {
      pageDiv.setAttribute('data-density', 'hard');
    }
    const img = document.createElement('img');
    img.src = src;
    img.draggable = false;
    img.alt = 'Page ' + (idx + 1);
    pageDiv.appendChild(img);
    flipbookEl.appendChild(pageDiv);
  });

  // Initialize StPageFlip
  pageFlip = new St.PageFlip(flipbookEl, {
    width: width,
    height: height,
    size: 'fixed',
    minWidth: 200,
    maxWidth: 2000,
    minHeight: 260,
    maxHeight: 2600,
    drawShadow: true,
    flippingTime: 700,
    usePortrait: true,
    startZIndex: 1,
    autoSize: true,
    maxShadowOpacity: 0.5,
    showCover: true,
    mobileScrollSupport: false,
    swipeDistance: 30,
    clickEventForward: true,
    useMouseEvents: true,
    showPageCorners: true
  });

  pageFlip.loadFromHTML(document.querySelectorAll('#flipbook .page'));

  // Hook up page-change events
  pageFlip.on('flip', e => {
    updatePageIndicator(e.data);
  });

  pageFlip.on('changeState', e => {
    // 'read' state means flip animation finished
  });

  // Initial UI sync
  updatePageIndicator(0);
}

function updatePageIndicator(currentPageIdx) {
  // currentPageIdx is the leading page (0-based) of the current spread.
  const total = pageImages.length;
  pageCurrentEl.textContent = currentPageIdx + 1;
  pageTotalEl.textContent = total;

  // Disable nav buttons at extremes
  navPrev.disabled = currentPageIdx <= 0;
  navNext.disabled = currentPageIdx >= total - 1;

  // Center the cover/back-cover when shown alone (desktop spread mode only)
  const bookWrap = document.querySelector('.book-wrap');
  bookWrap.classList.toggle('is-cover-alone', currentPageIdx === 0);
  bookWrap.classList.toggle('is-back-cover-alone', currentPageIdx === total - 1);

  // Update active thumbnail
  const thumbs = thumbsEl.querySelectorAll('.thumb');
  thumbs.forEach((t, idx) => {
    t.classList.toggle('active', idx === currentPageIdx);
    if (idx === currentPageIdx) {
      // Scroll into view if not visible
      const tRect = t.getBoundingClientRect();
      const sRect = thumbsEl.getBoundingClientRect();
      if (tRect.left < sRect.left || tRect.right > sRect.right) {
        t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }
  });
}

function buildThumbnails() {
  thumbsEl.innerHTML = '';
  pageImages.forEach((src, idx) => {
    const t = document.createElement('div');
    t.className = 'thumb';
    t.title = 'Page ' + (idx + 1);
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    t.appendChild(img);
    const num = document.createElement('div');
    num.className = 'thumb-num';
    num.textContent = idx + 1;
    t.appendChild(num);
    t.addEventListener('click', () => {
      if (pageFlip) pageFlip.flip(idx);
    });
    thumbsEl.appendChild(t);
  });
}

// ─── PDF loading entry points ──────────────────────────────────────
async function loadPdfFromArrayBuffer(buf, name) {
  currentPdfName = name || 'document.pdf';
  // Copy bytes for later download (the PDF.js getDocument call may detach the buffer)
  try {
    currentPdfBytes = buf.slice(0);
  } catch (e) {
    currentPdfBytes = null;
  }
  docTitleEl.textContent = currentPdfName.replace(/\.pdf$/i, '');

  landing.classList.add('hidden');
  showLoading();
  setLoading(5, 'OPENING');
  updateShareButton();

  try {
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    pdfDoc = pdf;
    setLoading(10, 'RENDERING');
    await renderPdfToImages(pdf);
    setLoading(95, 'BUILDING');
    buildThumbnails();
    buildFlipbook();
    setLoading(100, 'READY');
    setTimeout(hideLoading, 200);
  } catch (err) {
    console.error('PDF load failed:', err);
    loadingText.textContent = 'ERROR · COULD NOT LOAD PDF';
    showToast('Could not open this PDF');
  }
}

async function loadPdfFromUrl(url) {
  currentPdfUrl = url;
  const name = url.split('/').pop().split('?')[0] || 'document.pdf';

  landing.classList.add('hidden');
  showLoading();
  setLoading(2, 'FETCHING');

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    await loadPdfFromArrayBuffer(buf, name);
  } catch (err) {
    console.error('Fetch failed:', err);
    loadingText.textContent = 'ERROR · COULD NOT FETCH';
    showToast('Could not fetch the PDF. The link may have expired.');
    // After a moment, return to landing so user can try again
    setTimeout(() => {
      hideLoading();
      landing.classList.remove('hidden');
    }, 2500);
  }
}

function handleLocalFile(file) {
  if (!file || file.type !== 'application/pdf') {
    showToast('Please drop a PDF file');
    return;
  }
  currentPdfUrl = null;
  uploadState = 'idle';
  uploadProgress = 0;
  dropzone.classList.add('busy');
  const reader = new FileReader();
  reader.onload = e => {
    loadPdfFromArrayBuffer(e.target.result, file.name);
    dropzone.classList.remove('busy');
  };
  reader.onerror = () => {
    dropzone.classList.remove('busy');
    showToast('Could not read this file');
  };
  reader.readAsArrayBuffer(file);

  // Host the PDF in parallel so the share button has a link.
  uploadPdfToBlob(file);
}

// ─── Event wiring ──────────────────────────────────────────────────
fileInput.addEventListener('change', e => {
  if (e.target.files && e.target.files[0]) handleLocalFile(e.target.files[0]);
});

['dragenter', 'dragover'].forEach(ev => {
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.add('drag');
  });
});
['dragleave', 'drop'].forEach(ev => {
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop', e => {
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleLocalFile(e.dataTransfer.files[0]);
  }
});

// Whole-window drop after a doc is loaded? Reject by default.
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

// Nav buttons
navPrev.addEventListener('click', () => { if (pageFlip) pageFlip.flipPrev(); });
navNext.addEventListener('click', () => { if (pageFlip) pageFlip.flipNext(); });

// Keyboard
document.addEventListener('keydown', e => {
  if (landing.classList.contains('hidden') === false) return;
  if (e.key === 'ArrowLeft') { if (pageFlip) pageFlip.flipPrev(); }
  else if (e.key === 'ArrowRight') { if (pageFlip) pageFlip.flipNext(); }
  else if (e.key === 'Escape') {
    if ($('zoom-overlay').classList.contains('show')) closeZoom();
  }
});

// ─── Background upload to Vercel Blob ──────────────────────────────
// When the user drops a PDF locally we host it in the background so the
// share button has something to share. The flipbook renders in parallel.
let blobClientPromise = null;
function ensureBlobClientLoaded() {
  if (typeof window.vercelBlobUpload === 'function') return Promise.resolve();
  if (blobClientPromise) return blobClientPromise;
  blobClientPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/vercel-blob-client.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load upload client'));
    document.head.appendChild(s);
  });
  return blobClientPromise;
}

async function uploadPdfToBlob(file) {
  uploadState = 'uploading';
  uploadProgress = 0;
  updateShareButton();

  try {
    await ensureBlobClientLoaded();
    if (typeof window.vercelBlobUpload !== 'function') {
      throw new Error('Upload client failed to initialize');
    }
    const result = await window.vercelBlobUpload(file.name, file, {
      access: 'public',
      handleUploadUrl: '/api/upload',
      contentType: 'application/pdf',
      onUploadProgress: ev => {
        if (ev && typeof ev.percentage === 'number') {
          uploadProgress = Math.round(ev.percentage);
          updateShareButton();
        }
      },
    });
    currentPdfUrl = result.url;
    uploadState = 'done';
    updateShareButton();
    // Reflect the hosted URL in the address bar so a refresh keeps the link.
    try {
      const params = new URLSearchParams(window.location.search);
      params.set('pdf', currentPdfUrl);
      window.history.replaceState({}, '', '?' + params.toString());
    } catch (e) {}
    showToast('Share link ready');
  } catch (err) {
    console.error('Upload failed:', err);
    uploadState = 'failed';
    updateShareButton();
    showToast('Hosting failed — share link unavailable');
  }
}

// ─── Topbar actions ────────────────────────────────────────────────
function getShareUrl() {
  if (!currentPdfUrl) return null;
  return window.location.origin + '/?pdf=' + encodeURIComponent(currentPdfUrl);
}

function updateShareButton() {
  const btn = $('btn-share');
  if (uploadState === 'uploading') {
    btn.disabled = false;
    btn.title = `Hosting · ${uploadProgress}%`;
  } else if (currentPdfUrl) {
    btn.disabled = false;
    btn.title = 'Copy share link';
  } else if (uploadState === 'failed') {
    btn.disabled = false;
    btn.title = 'Hosting failed';
  } else {
    btn.disabled = true;
    btn.title = 'No PDF loaded';
  }
}

$('btn-share').addEventListener('click', async () => {
  if (uploadState === 'uploading') {
    showToast(`Hosting your booklet · ${uploadProgress}%`);
    return;
  }
  if (uploadState === 'failed') {
    showToast('Hosting failed — reload and try again');
    return;
  }
  const url = getShareUrl();
  if (!url) {
    showToast('No PDF loaded');
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Flipbook link copied');
  } catch {
    showToast('Could not copy link');
  }
});

$('btn-download').addEventListener('click', () => {
  if (currentPdfUrl) {
    // Hosted: direct link
    const a = document.createElement('a');
    a.href = currentPdfUrl;
    a.download = currentPdfName;
    a.target = '_blank';
    a.rel = 'noopener';
    a.click();
  } else if (currentPdfBytes) {
    // Local: build a blob URL and download
    const blob = new Blob([currentPdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentPdfName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } else {
    showToast('No PDF loaded');
  }
});

$('btn-zoom').addEventListener('click', () => {
  if (!pageImages.length) return;
  const currentIdx = parseInt(pageCurrentEl.textContent, 10) - 1;
  openZoom(currentIdx);
});

$('btn-fullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});

$('btn-close').addEventListener('click', () => {
  // Reset to landing
  if (pageFlip) { try { pageFlip.destroy(); } catch(e){} pageFlip = null; }
  pageImages = [];
  pdfDoc = null;
  currentPdfBytes = null;
  currentPdfUrl = null;
  uploadState = 'idle';
  uploadProgress = 0;
  updateShareButton();
  // Clear the ?pdf= param from the URL bar
  try { window.history.replaceState({}, '', window.location.pathname); } catch (e) {}
  flipbookEl.innerHTML = '';
  thumbsEl.innerHTML = '';
  docTitleEl.textContent = '';
  pageCurrentEl.textContent = '—';
  pageTotalEl.textContent = '—';
  landing.classList.remove('hidden');
});

// ─── Zoom overlay ──────────────────────────────────────────────────
function openZoom(pageIdx) {
  if (pageIdx < 0 || pageIdx >= pageImages.length) return;
  $('zoom-img').src = pageImages[pageIdx];
  $('zoom-overlay').classList.add('show');
}
function closeZoom() {
  $('zoom-overlay').classList.remove('show');
}
$('zoom-overlay').addEventListener('click', e => {
  if (e.target === $('zoom-overlay') || e.target === $('zoom-close') || e.target.closest('#zoom-close')) closeZoom();
});

// ─── Resize handling ───────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (pageImages.length) buildFlipbook();
  }, 200);
});

// ─── Initial load from ?pdf=URL query param ─────────────────────────
(function checkUrlParam() {
  updateShareButton();
  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get('pdf');
  if (pdfUrl) {
    // Decode and load
    try {
      const decoded = decodeURIComponent(pdfUrl);
      loadPdfFromUrl(decoded);
    } catch (err) {
      console.error('Bad ?pdf= param', err);
    }
  }
})();
</script>
</body>
</html>
